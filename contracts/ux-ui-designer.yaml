capabilities:
- analyze-context
- validate-inputs
- produce-evidence
- self-review
- handoff
receives:
- requirements
- scope
- constraints
- decisions
- risk-register
required_inputs:
- requirements
- scope
optional_inputs:
- constraints
- decisions
- risk-register
produces: &id001
- user-flows
- design-specification
- accessibility-review
required_outputs: *id001
consults:
- ../AGENTS.md
- ../core/SYSTEM.md
- ../core/QUALITY.md
- ../agents/ux-ui-designer.md
quality_gates:
- QG-DESIGN
approval_rules:
- gate owner approves evidence; agent cannot self-approve conflicts
next_agents:
- frontend-engineer
- mobile-engineer
cannot:
- não inventa pesquisa nem decide regra de negócio
- invent requirements or evidence
- exceed domain authority
human_approval_required:
- production
- material scope/cost/time change
- high residual risk
- sensitive data access
- irreversible decision
escalation_conditions:
- missing critical input
- authority conflict
- high risk
- failed quality gate
success_criteria:
- required outputs exist
- evidence accepted
- handoff compatible
- open critical items have owner
failure_conditions:
- fabricated evidence
- unauthorized action
- missing required output
- unresolved blocking gate
